created: '2026-05-04'
modified: '2026-09-06'
generated: '2026-09-06'
method: searched
source: https://datasportsgroup.com/products-api/
docs: https://datasportsgroup.com/products-api/
plan_count: 0
pricing_published: false
tags:
  - Sports Data
  - Pricing
  - Plans
description: >-
  DSG Sports Analytics publishes NO plans and NO prices. Access is quoted per customer by the sales
  team. This file records that absence with the provider's own words, and replaces a scaffold that had
  invented three tiers.
note: >-
  REPLACES a scaffold. Until 2026-09-06 this file carried three fabricated tiers - a "Free" tier with a
  1,000 request monthly quota, a "Professional" tier at 100,000/month, and an "Enterprise" tier - none
  of which DSG publishes. The Free tier was not merely unverified, it was CONTRADICTED by DSG's own
  FAQ, which states there is no free tier at all. The invented tiers have been deleted rather than
  retained.
findings:
  - question: What is the pricing for the Sports data API?
    answer_verbatim: >-
      "Pricing for our Sports Data API is variable and depends on several factors, including the
      specific sports you select, the number of competitions you require, and your choice of data pack.
      To get detailed pricing information tailored to your needs, please reach out to our sales team."
    source: https://datasportsgroup.com/products-api/
  - question: Are there any sports APIs available for free?
    answer_verbatim: >-
      "Regrettably, we do not offer a free tier for our sports APIs. All our subscription plans are
      paid, reflecting the value and quality of the sports data services we provide."
    source: https://datasportsgroup.com/products-api/
  - question: How can I access your sports data API?
    answer_verbatim: >-
      "To access our Sports API, you will receive personalized login credentials from our team."
    source: https://datasportsgroup.com/products-api/
plans: []
packaging:
  model: sales-quoted
  unit_of_sale: >-
    Entitlement, not volume. What varies between customers is which sports, which competitions and
    which feature parameters (facts, momentum, plays - each described in the docs as needing a
    "separate subscription") the account may call. The published rate ceiling is the same 10,000
    calls/hour for everyone - see rate-limits/dsg-sports-analytics-rate-limits.yml.
  named_packs:
    - name: TOP 50 Pack
      url: https://datasportsgroup.com/package/top-50-pack/
      contents: 50 named soccer competitions (UEFA Champions League, Bundesliga, Ligue 1, MLS, Premier
        League, La Liga, Serie A and others)
      price: not published
    - name: US Sports Pack
      url: https://datasportsgroup.com/package/us-sports-pack/
      contents: MLB, NHL, NBA, NFL, MLS, WNBA, NCAA Division I FBS, NCAA Division I, NCAA Division I (W)
      price: not published
    - name: eSports Pack
      url: https://datasportsgroup.com/package/esports-pack/
      contents: eSports titles (CS:GO, League of Legends, PUBG and others)
      price: not published
    - name: Migration Pack
      url: https://datasportsgroup.com/products-api/
      contents: >-
        Transition support for customers switching from another sports data provider, preserving the
        previous provider's information structure.
      price: not published
  note: >-
    The pack pages list the competitions each pack contains but carry no price and no quota - each ends
    in a "Contact Sales" call to action.
free_tier:
  offered: false
  evidence: https://datasportsgroup.com/products-api/
  contradiction_note: >-
    The same products page carries a "SIGNUP FOR FREE" button alongside the FAQ statement that no free
    tier exists. The signup route it points at (https://dsg-api.com/register/) returns HTTP 200 but
    renders no form, and the "Sign up" control is commented out of the dsg-api.com header. Read
    together, "free" refers to the cost of making contact, not to a usable free API tier. Recorded as
    a published contradiction rather than resolved in DSG's favour.
trial:
  offered: unknown
  note: Several coverage pages carry a "Start Free Trial Today" title tag, but no trial terms, duration
    or self-serve trial signup is published anywhere on the site.
