note: >-
  DSG sells an embeddable presentation layer alongside the data API. This is a real second product
  surface and is distinct from packages/ (there are no client SDKs). It is catalogued here as an
  embeddable-component family, not as an SDK.
delivery:
  model: hosted embed
  hosts:
    - host: widgets.datasportsgroup.com
      status: 403
      note: >-
        Named as the widget origin in the showcase page markup. Returns HTTP 403 Forbidden to an
        anonymous request at its root - the embed surface is served to licensed customer domains, which
        is consistent with DSG's layer-3 per-domain allowlist described in
        authentication/dsg-sports-analytics-authentication.yml.
    - host: dsg-widgets.com
      status: 200
      note: Resolves and returns an empty 200 body at the root; no public loader, catalogue or docs.
    - host: www.dsg-images.com
      note: Image/asset CDN referenced by the widget and documentation markup.
  loader_library: not published
  integration_docs: not published
  note: >-
    No embed snippet, loader script URL, configuration reference or versioned component package is
    published anywhere public. Every widget entry on the showcase page ends in "Book a call" or
    "Contact Sales" rather than in a code sample, so the integration contract is sales-gated.
