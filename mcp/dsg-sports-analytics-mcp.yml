source: https://dsg-api.com/ (documentation index) and the twelve soccer operation pages listed in data-model/dsg-sports-analytics-data-model.yml
note: NOBODY SHIPS AN MCP SERVER FOR THIS API. This is a candidate tool list derived from DSG's own published
  operation documentation, not a description of anything DSG operates. Searched the docs, the marketing
  site, npm and the public web for a DSG MCP server on 2026-09-06 and found none; POSTing tools/list to
  https://dsg-api.com/mcp returns the HTML documentation shell, and mcp.datasportsgroup.com does not resolve
  to a certificate for that name. No endpoint is invented below.
deployment:
  mode: none
  endpoint: null
  install: null
  package: null
  auth: api-key
  verified: derived
  note: 'mode: none - DSG publishes neither a remote MCP endpoint nor a stdio package. auth is recorded
    as api-key because that is what the underlying API requires (client + authkey query parameters); it
    is not a claim about an MCP server, because there is no server.'
server:
